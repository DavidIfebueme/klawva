name: Hygiene

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reject committed archives
        run: |
          found=$(git ls-files | grep -Ei '\.(zip|tar|tgz|tar\.gz|7z|rar)$' || true)
          if [ -n "$found" ]; then
            echo "Archives must not be committed. Found:"
            echo "$found"
            exit 1
          fi
      - name: reject large tracked files
        run: |
          failed=0
          while IFS= read -r file; do
            size=$(git cat-file -s "$(git rev-parse "HEAD:$file")" 2>/dev/null || echo 0)
            if [ "$size" -gt 2000000 ]; then
              echo "$file is $((size / 1048576))MB, over the 2MB limit"
              failed=1
            fi
          done < <(git ls-files)
          exit $failed
      - name: keep one writer for session state
        run: |
          # The session durable object owns sessions.state. Every later change
          # goes through projectState in apps/worker/src/session/agent.ts. The
          # one other write is the session creation insert, which sets the
          # initial pending state. perl scans whole files so a SET broken across
          # lines is still caught.
          updates=$(perl -0777 -ne '
            print "$ARGV\n" if /UPDATE\s+sessions\b[^;"\x60]*?\bstate\s*=/gis;
          ' $(git ls-files 'apps/worker/src') | grep -v '^apps/worker/src/session/agent.ts$' || true)
          inserts=$(git grep -lIE 'INSERT[[:space:]]+INTO[[:space:]]+sessions' -- 'apps/worker/src' ':!apps/worker/src/session/agent.ts' || true)
          failed=0
          if [ -n "$updates" ]; then
            echo "sessions.state is written outside the session durable object:"
            echo "$updates"
            failed=1
          fi
          if [ "$inserts" != "apps/worker/src/app.ts" ]; then
            echo "the session creation insert is the only direct insert into sessions. found: ${inserts:-none}"
            failed=1
          fi
          exit $failed
