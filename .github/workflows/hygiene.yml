name: Hygiene

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reject committed archives
        run: |
          found=$(git ls-files | grep -Ei '\.(zip|tar|tgz|tar\.gz|7z|rar)$' || true)
          if [ -n "$found" ]; then
            echo "Archives must not be committed. Found:"
            echo "$found"
            exit 1
          fi
      - name: reject large tracked files
        run: |
          failed=0
          while IFS= read -r file; do
            size=$(git cat-file -s "$(git rev-parse "HEAD:$file")" 2>/dev/null || echo 0)
            if [ "$size" -gt 2000000 ]; then
              echo "$file is $((size / 1048576))MB, over the 2MB limit"
              failed=1
            fi
          done < <(git ls-files)
          exit $failed
      - name: keep one writer for session state
        run: |
          offenders=$(git grep -n -I -i -E 'UPDATE[[:space:]]+sessions[[:space:]]+SET[[:space:]]+state' -- 'apps/worker/src' ':!apps/worker/src/session/agent.ts' || true)
          if [ -n "$offenders" ]; then
            echo "Session state is projected from the session durable object. Write it through projectState in apps/worker/src/session/agent.ts, not directly."
            echo "$offenders"
            exit 1
          fi
