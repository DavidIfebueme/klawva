name: Desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install the workspace
        run: pnpm install --frozen-lockfile

      - name: build the desktop frontend
        run: pnpm --dir apps/desktop build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: build the tauri shell
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release

      - name: smoke the built binary
        run: ./apps/desktop/src-tauri/target/release/klawva-desktop.exe --smoke
