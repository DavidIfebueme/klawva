name: Desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [master]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install the workspace
        run: pnpm install --frozen-lockfile

      - name: build the desktop frontend
        run: pnpm --dir apps/desktop build
        env:
          VITE_GOOGLE_CLIENT_ID: 446318558489-f16fn18krt9vk0egftj6kbpcdlmkk2m7.apps.googleusercontent.com

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: build the tauri shell
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release

      - name: smoke the built binary
        run: ./apps/desktop/src-tauri/target/release/klawva-desktop.exe --smoke

      - name: bundle the windows installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: pnpm --dir apps/desktop tauri build --bundles nsis

      - name: stage the installer under its stable name
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $installer.FullName klawva-desktop-windows.exe

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: klawva-desktop-windows
          path: klawva-desktop-windows.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install the workspace
        run: pnpm install --frozen-lockfile

      - name: build the desktop frontend
        run: pnpm --dir apps/desktop build
        env:
          VITE_GOOGLE_CLIENT_ID: 446318558489-f16fn18krt9vk0egftj6kbpcdlmkk2m7.apps.googleusercontent.com

      - name: install tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: build the tauri shell
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release

      - name: smoke the built binary
        run: ./apps/desktop/src-tauri/target/release/klawva-desktop --smoke

      - name: bundle the linux installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: pnpm --dir apps/desktop tauri build --bundles appimage

      - name: stage the installer under its stable name
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          installer=$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          cp "$installer" klawva-desktop-linux.AppImage

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: klawva-desktop-linux
          path: klawva-desktop-linux.AppImage
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build, build-linux]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: desktop latest
          prerelease: true
          files: |
            klawva-desktop-windows.exe
            klawva-desktop-linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
