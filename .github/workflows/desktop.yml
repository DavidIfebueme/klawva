name: Desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [master]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install the workspace
        run: pnpm install --frozen-lockfile

      - name: build the desktop frontend
        run: pnpm --dir apps/desktop build
        env:
          VITE_GOOGLE_CLIENT_ID: 446318558489-f16fn18krt9vk0egftj6kbpcdlmkk2m7.apps.googleusercontent.com

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: build the tauri shell
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release

      - name: smoke the built binary
        run: ./apps/desktop/src-tauri/target/release/klawva-desktop.exe --smoke

      - name: bundle the windows installer
        if: github.ref == 'refs/heads/master'
        run: pnpm --dir apps/desktop tauri build
        env:
          VITE_GOOGLE_CLIENT_ID: 446318558489-f16fn18krt9vk0egftj6kbpcdlmkk2m7.apps.googleusercontent.com

      - name: stage the installer under its stable name
        if: github.ref == 'refs/heads/master'
        run: cp "apps/desktop/src-tauri/target/release/bundle/nsis/Klawva_0.1.0_x64-setup.exe" klawva-desktop-windows.exe

      - name: publish the installer to the rolling release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: desktop latest
          prerelease: true
          files: klawva-desktop-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install the workspace
        run: pnpm install --frozen-lockfile

      - name: build the desktop frontend
        run: pnpm --dir apps/desktop build
        env:
          VITE_GOOGLE_CLIENT_ID: 446318558489-f16fn18krt9vk0egftj6kbpcdlmkk2m7.apps.googleusercontent.com

      - name: install tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: build the tauri shell
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release

      - name: smoke the built binary
        run: ./apps/desktop/src-tauri/target/release/klawva-desktop --smoke

      - name: bundle the linux installer
        if: github.ref == 'refs/heads/master'
        run: pnpm --dir apps/desktop tauri build
        env:
          VITE_GOOGLE_CLIENT_ID: 446318558489-f16fn18krt9vk0egftj6kbpcdlmkk2m7.apps.googleusercontent.com

      - name: stage the installer under its stable name
        if: github.ref == 'refs/heads/master'
        run: cp apps/desktop/src-tauri/target/release/bundle/appimage/Klawva_0.1.0_amd64.AppImage klawva-desktop-linux.AppImage

      - name: publish the installer to the rolling release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: desktop latest
          prerelease: true
          files: klawva-desktop-linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
